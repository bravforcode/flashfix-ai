<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚡ FlashFix AI</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;800&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --cream:#FAF9F6;--b1:#E5DFD5;--b2:#C8C0B5;
  --t1:#1C1A18;--t2:#6B6460;--t3:#A8A49F;
  --red:#8B1A1A;--redl:#F7EEEE;--redm:#C44040;
  --ok:#2A6049;--okl:#EBF5EF;--okb:#A8D5BC;
  --warn:#C44B1A;--warnl:#FDF0E8;--warnb:#F0C4A8;
  --gold:#7A6200;--goldl:#FFFBF0;--goldb:#E8D98A;
  --blue:#1A4A8B;--bluel:#EEF3FA;--blueb:#B0C8E8;
  --pur:#5A1A8B;--purl:#F3EEFD;--purb:#C8B0E8;
  --teal:#0D6B6B;--teall:#E8F6F6;--tealb:#7ECECE;
  --r:10px;--shadow:0 4px 24px rgba(0,0,0,.08);--shadow-sm:0 2px 12px rgba(0,0,0,.06);
  --ease:cubic-bezier(.4,0,.2,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);
}
html,body{height:100%;background:var(--cream);font-family:'Noto Sans Thai',sans-serif;font-size:14px;color:var(--t1);line-height:1.6}
.serif{font-family:'Shippori Mincho B1',serif}

/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideInR{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInL{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideOutL{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-32px)}}
@keyframes slideOutR{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(28px)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes barFill{from{width:0}to{width:var(--w)}}
@keyframes bk{0%,80%,100%{opacity:.12}40%{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shimmer{0%{background-position:-500px 0}100%{background-position:500px 0}}
@keyframes countUp{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cardFlipIn{from{opacity:0;transform:rotateX(8deg) scale(.96)}to{opacity:1;transform:rotateX(0) scale(1)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(139,26,26,.15)}50%{box-shadow:0 0 0 8px rgba(139,26,26,0)}}
@keyframes slideDrawer{from{transform:translateX(100%)}to{transform:translateX(0)}}

/* ── Base ── */
.sk{height:14px;margin-bottom:10px;border-radius:6px;background:linear-gradient(90deg,#f0ede8 0%,#e4dfd6 50%,#f0ede8 100%);background-size:800px 100%;animation:shimmer 1.4s ease infinite}
.sk-lg{height:22px}.sk-sm{height:10px;width:55%}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s var(--ease);border:1.5px solid transparent;font-family:'Noto Sans Thai',sans-serif;touch-action:manipulation;min-height:44px;letter-spacing:.1px}
.btn:active{transform:scale(.96)}
.btn-p{background:var(--red);color:#fff;border-color:var(--red)}.btn-p:hover{background:var(--redm);transform:translateY(-1px);box-shadow:0 4px 12px rgba(139,26,26,.3)}
.btn-p:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-g{background:transparent;color:var(--t2);border-color:var(--b1)}.btn-g:hover{background:#F5F2EE;border-color:var(--b2)}
.btn-o{background:#fff;color:var(--t1);border-color:var(--b1);padding:8px 16px;font-size:12px}.btn-o:hover{border-color:var(--b2);background:#FAFAF8}
.btn-o:disabled{opacity:.35;cursor:not-allowed}
.btn-b{background:var(--bluel);color:var(--blue);border-color:var(--blueb)}.btn-b:hover{background:#d4e6f6;transform:translateY(-1px)}
.btn-teal{background:var(--teall);color:var(--teal);border-color:var(--tealb)}.btn-teal:hover{background:#d0ecec}
.btn-cal{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .18s;border:1.5px solid;min-height:40px;font-family:'Noto Sans Thai',sans-serif}

.card{background:#fff;border:1px solid var(--b1);border-radius:var(--r);padding:20px}
.card-hover{transition:box-shadow .22s,transform .22s}.card-hover:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.badge{display:inline-block;padding:2px 10px;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.2px}
.divider{height:1px;background:var(--b1);margin:18px 0}

.step-dot{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:all .3s;flex-shrink:0}
.step-conn{height:1px;flex:1;max-width:28px;transition:background .3s}
.drop-zone{border:2px dashed var(--b2);border-radius:14px;padding:36px 24px;text-align:center;cursor:pointer;transition:all .22s;position:relative;overflow:hidden;background:#fff}
.drop-zone:hover,.drop-zone.hover{border-color:var(--red);background:var(--redl)}
.drop-zone.dragging{border-color:var(--red);background:var(--redl)}
.opt{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border:1.5px solid var(--b1);border-radius:var(--r);cursor:pointer;transition:all .18s;background:#fff;text-align:left;width:100%;font-family:'Noto Sans Thai',sans-serif;min-height:52px}
.opt:hover:not([disabled]){border-color:var(--b2);background:#FAFAF8;transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.opt.selected{border-color:var(--red);background:var(--redl)}
.opt.correct{border-color:var(--ok)!important;background:var(--okl)!important}
.opt.wrong{border-color:var(--warn)!important;background:var(--warnl)!important}
.opt-lbl{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;transition:all .18s;margin-top:1px}
.tab{padding:10px 14px;border:none;background:transparent;font-size:12px;font-weight:600;color:var(--t3);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .18s;font-family:'Noto Sans Thai',sans-serif;white-space:nowrap}
.tab.on{color:var(--red);border-bottom-color:var(--red)}
.tab:hover:not(.on){color:var(--t2)}
.prog-bar{height:5px;background:#EDE8E0;border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;animation:barFill .9s var(--ease) forwards;width:var(--w)}
.dot-load span{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block;animation:bk 1.3s infinite}
.dot-load span:nth-child(2){animation-delay:.22s}.dot-load span:nth-child(3){animation-delay:.44s}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid var(--b1);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
textarea,input,select{font-family:'Noto Sans Thai',sans-serif;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--red)!important}

/* ── Flashcard 3D ── */
.fc-scene{perspective:1200px;cursor:pointer;user-select:none}
.fc-inner{transform-style:preserve-3d;transition:transform .6s cubic-bezier(.45,.05,.55,.95);position:relative;width:100%;height:100%}
.fc-inner.flipped{transform:rotateY(180deg)}
.fc-face{backface-visibility:hidden;position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.fc-back{transform:rotateY(180deg)}
.fc-gradient-accent{background:linear-gradient(135deg,#8B1A1A 0%,#C44040 100%)}
.fc-gradient-blue{background:linear-gradient(135deg,#1A4A8B 0%,#3b72d6 100%)}
.fc-gradient-purple{background:linear-gradient(135deg,#5A1A8B 0%,#9b4bdb 100%)}
.fc-gradient-teal{background:linear-gradient(135deg,#0D6B6B 0%,#1ea0a0 100%)}
.fc-gradient-gold{background:linear-gradient(135deg,#7A6200 0%,#c49b00 100%)}

/* ── History Sidebar ── */
#layout{display:flex;gap:0;min-height:100vh;position:relative}
#main-col{flex:1;min-width:0;padding:24px 16px 52px}
#hist-col{width:280px;flex-shrink:0;background:#fff;border-left:1px solid var(--b1);padding:0;overflow-y:auto;position:sticky;top:0;height:100vh;transition:transform .3s var(--ease)}
#hist-toggle{display:none;position:fixed;bottom:20px;right:16px;z-index:200;width:48px;height:48px;border-radius:50%;background:var(--red);border:none;color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 16px rgba(139,26,26,.35);transition:all .2s;animation:glowPulse 2.5s ease infinite}
.hist-item{padding:12px 16px;border-bottom:1px solid var(--b1);cursor:default;transition:background .15s;animation:fadeIn .25s ease}
.hist-item:hover{background:#FAFAF8}
.hist-empty{padding:32px 16px;text-align:center;color:var(--t3);font-size:12px}

/* ── API Settings Modal ── */
#api-modal{display:none;position:fixed;inset:0;z-index:9000;background:rgba(28,26,24,.7);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:20px}
#api-modal.open{display:flex}

@media(max-width:899px){
  #hist-col{position:fixed;right:0;top:0;bottom:0;z-index:500;transform:translateX(100%);box-shadow:-4px 0 24px rgba(0,0,0,.12)}
  #hist-col.open{transform:translateX(0);animation:slideDrawer .28s var(--ease)}
  #hist-toggle{display:flex;align-items:center;justify-content:center}
  #main-col{padding:18px 12px 80px}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .inner{padding:20px 16px!important}
  .btn{font-size:12px;min-height:42px}
}
@media(min-width:900px){
  #main-col{padding:28px 20px 60px}
  .inner{padding:28px 30px!important}
}
.pad-inner{max-width:660px;margin:0 auto}
.inner{background:#fff;border:1px solid var(--b1);border-radius:12px}
</style>
</head>
<body>

<!-- API Settings Modal -->
<div id="api-modal">
  <div style="background:#fff;border-radius:16px;padding:28px 24px;max-width:420px;width:100%;animation:scaleIn .22s ease;box-shadow:0 28px 80px rgba(0,0,0,.2)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
      <div style="font-size:17px;font-weight:700">⚙️ ตั้งค่า API</div>
      <button id="api-close" style="background:none;border:none;cursor:pointer;font-size:20px;color:var(--t3);line-height:1;padding:4px">×</button>
    </div>
    <div style="font-size:12px;color:var(--t2);margin-bottom:16px;line-height:1.9;background:var(--bluel);border-radius:8px;padding:10px 12px">
      ใช้ Anthropic Claude (built-in ไม่ต้องใส่ key) หรือ OpenAI / Gemini (ใส่ key ด้านล่าง)
    </div>
    <div style="margin-bottom:14px">
      <label style="font-size:11px;font-weight:700;color:var(--t2);display:block;margin-bottom:6px">AI Provider</label>
      <select id="api-provider" style="width:100%;padding:10px 12px;border:1.5px solid var(--b1);border-radius:8px;font-size:13px;background:#fff;cursor:pointer">
        <option value="anthropic">🤖 Anthropic Claude (ฟรี built-in)</option>
        <option value="openai">🟢 OpenAI GPT-4o</option>
        <option value="gemini">🔵 Google Gemini Flash</option>
      </select>
    </div>
    <div id="key-row" style="margin-bottom:16px;display:none">
      <label style="font-size:11px;font-weight:700;color:var(--t2);display:block;margin-bottom:6px">API Key</label>
      <input id="api-key-input" type="password" placeholder="sk-... หรือ AIzaSy..."
        style="width:100%;padding:10px 12px;border:1.5px solid var(--b1);border-radius:8px;font-size:13px">
      <div style="font-size:10px;color:var(--t3);margin-top:5px">Key จะเก็บไว้ใน localStorage ของเบราว์เซอร์เท่านั้น</div>
    </div>
    <button id="api-save" class="btn btn-p" style="width:100%">บันทึก</button>
  </div>
</div>

<!-- Layout -->
<div id="layout">

<!-- ── MAIN COLUMN ── -->
<div id="main-col">
<div class="pad-inner">
  <!-- Header -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
    <div style="display:flex;align-items:center;gap:10px">
      <button id="btn-home-logo" style="background:none;border:none;cursor:pointer;padding:0">
        <span class="serif" style="font-size:20px;font-weight:800;letter-spacing:-.3px">⚡ FlashFix <span style="color:var(--red)">AI</span></span>
      </button>
      <span id="mode-badge" style="display:none"></span>
    </div>
    <div id="hdr-right" style="display:flex;align-items:center;gap:8px">
      <button id="btn-api-open" title="ตั้งค่า API"
        style="background:none;border:1.5px solid var(--b1);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:12px;color:var(--t3);transition:all .18s"
        onmouseover="this.style.borderColor='var(--b2)';this.style.color='var(--t1)'"
        onmouseout="this.style.borderColor='var(--b1)';this.style.color='var(--t3)'">⚙️</button>
    </div>
  </div>
  <div id="step-bar" style="display:flex;align-items:center;justify-content:center;margin-bottom:22px"></div>
  <div id="pg" class="inner" style="padding:28px 30px"></div>
</div>
</div>

<!-- ── HISTORY SIDEBAR ── -->
<div id="hist-col">
  <div style="padding:18px 16px 12px;border-bottom:1px solid var(--b1);position:sticky;top:0;background:#fff;z-index:10">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:13px;font-weight:700">📋 ประวัติการเรียน</div>
      <button id="hist-clear" style="background:none;border:none;cursor:pointer;font-size:11px;color:var(--t3);padding:4px 8px;border-radius:4px;transition:all .15s" onmouseover="this.style.color='var(--warn)'" onmouseout="this.style.color='var(--t3)'">ลบทั้งหมด</button>
    </div>
    <div id="hist-count" style="font-size:11px;color:var(--t3);margin-top:3px"></div>
  </div>
  <div id="hist-list"></div>
</div>

</div><!-- /layout -->

<!-- History toggle button (mobile) -->
<button id="hist-toggle" onclick="toggleHistDrawer()">📋</button>

<script>
/* ════════════════════════════════
   CONSTANTS & STATE
════════════════════════════════ */
const TOPICS=[
  {id:'derivative',th:'อนุพันธ์',jp:'微分',lv:'ม.4-5',sym:'∂',color:'accent'},
  {id:'integral',th:'อินทิกรัล',jp:'積分',lv:'ม.5',sym:'∫',color:'blue'},
  {id:'limit',th:'ลิมิต',jp:'極限',lv:'ม.4',sym:'lim',color:'purple'},
  {id:'trigonometry',th:'ตรีโกณมิติ',jp:'三角',lv:'ม.4',sym:'sin',color:'teal'},
  {id:'algebra',th:'พีชคณิต',jp:'代数',lv:'ม.1-3',sym:'x²',color:'gold'},
  {id:'probability',th:'ความน่าจะเป็น',jp:'確率',lv:'ม.5-6',sym:'P',color:'accent'},
  {id:'geometry',th:'เรขาคณิต',jp:'幾何',lv:'ม.1-3',sym:'△',color:'blue'},
  {id:'statistics',th:'สถิติ',jp:'統計',lv:'ม.5-6',sym:'x̄',color:'purple'},
];
const API_URL='https://api.anthropic.com/v1/messages';
let CFG={provider:'anthropic',key:''};
try{const c=JSON.parse(localStorage.getItem('ff_cfg')||'{}');if(c.provider)CFG=c;}catch{}

let S={
  page:'home',mode:'',
  fileName:'',fileText:'',fileB64:null,fileMime:null,
  fileSummary:null,examQ:[],examA:{},examResult:null,
  wrongIdx:0,wrongExplains:{},
  topic:null,quiz:null,answer:'',solution:null,showAnswer:false,
  teachBack:'',tbResult:null,activeTab:'solution',
  flashcards:[],cardIdx:0,flipped:false,cardsDone:{},
  remMiniQuiz:[],quizReveal:{},examIdx:0,loading:false,
  mastery:{derivative:22,integral:15,limit:48,trigonometry:62,algebra:78,probability:35,geometry:55,statistics:42}
};
let busy=false;

/* ════════════════════════════════
   HISTORY SYSTEM
════════════════════════════════ */
let HIST=[];
try{HIST=JSON.parse(localStorage.getItem('ff_history')||'[]');}catch{}

function saveHistory(){try{localStorage.setItem('ff_history',JSON.stringify(HIST.slice(0,80)));}catch{}}
function addHistory(type,data){
  HIST.unshift({type,data,ts:Date.now()});
  saveHistory();renderHistory();
}
function fmtDate(ts){
  const d=new Date(ts);
  return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear().toString().slice(2)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function renderHistory(){
  const list=document.getElementById('hist-list');
  const cnt=document.getElementById('hist-count');
  if(!list)return;
  if(cnt)cnt.textContent=`${HIST.length} รายการ`;
  if(!HIST.length){list.innerHTML='<div class="hist-empty">🌱 ยังไม่มีประวัติ<br>เริ่มเรียนเพื่อบันทึก</div>';return;}
  list.innerHTML=HIST.map((h,i)=>{
    const icons={file:'📄',quiz:'🧮',exam:'📝',flashcard:'🎴',teachback:'🎓'};
    const ic=icons[h.type]||'📌';
    let title='',sub='',score='';
    if(h.type==='file'){title=h.data.title||'ไฟล์';sub=h.data.fileName||'';}
    else if(h.type==='quiz'){title=h.data.topic;sub=h.data.question?.substring(0,40)+'...';}
    else if(h.type==='exam'){title='ข้อสอบ '+h.data.title;sub=`${h.data.score}/${h.data.total} ข้อ`;score=`${Math.round(h.data.score/h.data.total*100)}%`;}
    else if(h.type==='flashcard'){title='Flashcard';sub=h.data.topic||h.data.title||'';}
    else if(h.type==='teachback'){title='Teach-Back '+h.data.topic;sub=`คะแนน ${h.data.score}/10`;}
    return`<div class="hist-item" style="animation:fadeUp .2s ${i*.03}s both ease">
      <div style="display:flex;gap:10px;align-items:flex-start">
        <div style="font-size:18px;margin-top:1px">${ic}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</div>
          <div style="font-size:11px;color:var(--t3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sub}</div>
          <div style="font-size:10px;color:var(--t3);margin-top:3px">${fmtDate(h.ts)}</div>
        </div>
        ${score?`<div style="font-size:13px;font-weight:700;color:${parseInt(score)>=60?'var(--ok)':'var(--warn)'};flex-shrink:0">${score}</div>`:''}
      </div>
    </div>`;
  }).join('');
}
function toggleHistDrawer(){
  document.getElementById('hist-col')?.classList.toggle('open');
}
document.addEventListener('click',e=>{
  const hc=document.getElementById('hist-col');
  const ht=document.getElementById('hist-toggle');
  if(hc&&ht&&!hc.contains(e.target)&&!ht.contains(e.target)&&window.innerWidth<900){
    hc.classList.remove('open');
  }
});

/* ════════════════════════════════
   API LAYER
════════════════════════════════ */
async function callAI(sys,userContent,maxT=1200){
  let msgs=[];
  let content;
  if(typeof userContent==='string') content=userContent;
  else content=userContent; // array of parts

  // Anthropic (default, no key needed here - proxied)
  if(CFG.provider==='anthropic'||!CFG.provider){
    if(typeof content==='string') msgs=[{role:'user',content}];
    else msgs=[{role:'user',content}];
    const body={model:'claude-sonnet-4-20250514',max_tokens:maxT,messages:msgs};
    if(sys)body.system=sys;
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await res.json();
    if(!res.ok||d.error)throw new Error(d.error?.message||`HTTP ${res.status}`);
    const raw=d.content?.[0]?.text||'';
    if(!raw)throw new Error('Empty');
    return JSON.parse(raw.replace(/```json\n?|```\n?/g,'').trim());
  }
  // OpenAI
  if(CFG.provider==='openai'){
    const parts=typeof content==='string'?[{type:'text',text:content}]:
      content.map(p=>p.type==='text'?{type:'text',text:p.text}:
        {type:'image_url',image_url:{url:`data:${p.source?.media_type};base64,${p.source?.data}`}});
    const res=await fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${CFG.key}`},
      body:JSON.stringify({model:'gpt-4o',max_tokens:maxT,temperature:0.2,
        response_format:{type:'json_object'},
        messages:[...(sys?[{role:'system',content:sys}]:[]),{role:'user',content:parts}]})
    });
    const d=await res.json();
    if(!res.ok)throw new Error(d.error?.message||'OpenAI error');
    return JSON.parse(d.choices[0].message.content);
  }
  // Gemini
  if(CFG.provider==='gemini'){
    const parts2=typeof content==='string'?[{text:content}]:
      content.map(p=>p.type==='text'?{text:p.text}:{inlineData:{mimeType:p.source?.media_type,data:p.source?.data}});
    const body2={contents:[{parts:parts2}],generationConfig:{maxOutputTokens:maxT,temperature:0.2,responseMimeType:'application/json'}};
    if(sys)body2.system_instruction={parts:[{text:sys}]};
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${CFG.key}`,
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body2)});
    const d=await res.json();
    if(!res.ok||d.error)throw new Error(d.error?.message||'Gemini error');
    const raw=d.candidates?.[0]?.content?.parts?.[0]?.text||'';
    return JSON.parse(raw.replace(/```json\n?|```\n?/g,'').trim());
  }
  throw new Error('Unknown provider');
}

/* ════════════════════════════════
   FILE HANDLING
════════════════════════════════ */
function fileToB64(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
}
async function parsePPTX(file){
  const ab=await file.arrayBuffer();
  const zip=await JSZip.loadAsync(ab);
  const names=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a,b)=>+a.match(/\d+/)[0]-+b.match(/\d+/)[0]);
  let out='';
  for(const name of names.slice(0,18)){
    const xml=await zip.files[name].async('text');
    const txts=(xml.match(/<a:t[^>]*>([^<]*)<\/a:t>/g)||[]).map(x=>x.replace(/<[^>]+>/g,'').trim()).filter(Boolean);
    if(txts.length)out+=`[Slide ${name.match(/\d+/)[0]}]: ${txts.join(' ')}\n`;
  }
  return out.substring(0,5000)||'(ไม่พบข้อความ)';
}
async function handleFile(file){
  const ext=file.name.toLowerCase();
  const isPPTX=ext.endsWith('.pptx')||ext.endsWith('.ppt');
  const isPDF=file.type==='application/pdf';
  const isImg=file.type.startsWith('image/');
  if(!isPPTX&&!isPDF&&!isImg){alert('รองรับเฉพาะ PDF, PPTX, PNG, JPG');return;}
  if(file.size>15*1024*1024){alert('ไฟล์ใหญ่เกิน 15MB');return;}
  S.fileName=file.name;S.mode='file';nav('file_processing');
  try{
    if(isPPTX){S.fileText=await parsePPTX(file);S.fileB64=null;}
    else{S.fileB64=await fileToB64(file);S.fileMime=file.type;S.fileText='';}
    const result=await callAnalyze();
    S.fileSummary=result;S.examQ=result.questions||[];
    addHistory('file',{title:result.title||file.name,fileName:file.name,subject:result.subject});
    nav('file_summary');
  }catch(e){console.error(e);S.loading=false;nav('file_upload');}
}

/* ════════════════════════════════
   CALENDAR INTEGRATION
════════════════════════════════ */
function makeICS(events){
  const esc=s=>(s||'').replace(/[,;\\]/g,'\\$&').replace(/\n/g,'\\n');
  const fmtDT=d=>{
    const p=n=>String(n).padStart(2,'0');
    return`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`;
  };
  const uid=()=>Math.random().toString(36).substring(2,10).toUpperCase();
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//FlashFix AI//TH\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\n';
  events.forEach(ev=>{
    const s=new Date(ev.start);const e=new Date(ev.start+ev.dur*60000);
    ics+=`BEGIN:VEVENT\r\nUID:${uid()}@flashfix\r\nDTSTAMP:${fmtDT(new Date())}\r\nDTSTART:${fmtDT(s)}\r\nDTEND:${fmtDT(e)}\r\nSUMMARY:${esc(ev.title)}\r\nDESCRIPTION:${esc(ev.desc)}\r\nBEGIN:VALARM\r\nTRIGGER:-PT15M\r\nACTION:DISPLAY\r\nDESCRIPTION:ถึงเวลาทบทวน!\r\nEND:VALARM\r\nEND:VEVENT\r\n`;
  });
  ics+='END:VCALENDAR';
  return ics;
}
function downloadICS(events,fname){
  const blob=new Blob([makeICS(events)],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname||'flashfix-review.ics';a.click();
}
function googleCalURL(ev){
  const fmtG=d=>{const p=n=>String(n).padStart(2,'0');const dd=new Date(d);return`${dd.getFullYear()}${p(dd.getMonth()+1)}${p(dd.getDate())}T${p(dd.getHours())}${p(dd.getMinutes())}00`;}
  const s=fmtG(ev.start);const e=fmtG(ev.start+ev.dur*60000);
  return`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(ev.title)}&dates=${s}/${e}&details=${encodeURIComponent(ev.desc)}&sf=true`;
}
function buildReviewEvents(topic){
  const now=new Date();const base=new Date(now.getFullYear(),now.getMonth(),now.getDate(),20,0,0).getTime();
  const offsets=[0,1,4,11,25];
  return offsets.map((d,i)=>({
    title:`⚡ FlashFix ทบทวน: ${topic} (ครั้งที่${i+1})`,
    desc:`Spaced Repetition ครั้งที่ ${i+1} สำหรับ ${topic}\nFlashFix AI Learning System`,
    start:base+d*86400000,dur:20
  }));
}

async function pickTopic(id){
  const t=TOPICS.find(x=>x.id===id);
  S.topic=t;S.quiz=null;S.answer='';S.solution=null;S.showAnswer=false;S.loading=true;nav('quiz');
  addHistory('quiz',{topic:t.th,question:null});
  try{S.quiz=await callQuiz(t);}
  catch(e){console.error(e);S.quiz={question:`จงหา f'(x) เมื่อ f(x) = x³ · sin(x)`,answer:"f'(x) = 3x²sin(x) + x³cos(x)",wrongExample:"3x²sin(x)",difficulty:'medium',hint:'ใช้ Product Rule'};}
  S.loading=false;render();
}
async function submitAnswer(){
  if(!S.answer.trim())return;
  S.solution=null;S.loading=true;nav('solution');
  try{S.solution=await callSolution();}
  catch(e){console.error(e);S.solution={isCorrect:false,errorType:'Error',errorTypeThai:'ไม่สามารถตรวจได้',studentAnswer:S.answer,studentMistake:'กรุณาลองใหม่',steps:[{num:1,title:'เฉลย',math:S.quiz?.answer||'',explain:''}],keyRule:'',commonTrap:'',severity:'major'};}
  S.loading=false;render();
}
async function submitTB(){
  if(S.teachBack.trim().length<15)return;
  S.tbResult=null;S.loading=true;render();
  try{S.tbResult=await callTB();addHistory('teachback',{topic:S.topic?.th||'',score:S.tbResult.score});}
  catch(e){console.error(e);S.tbResult={passed:false,score:5,feedback:'ไม่สามารถตรวจได้ ลองใหม่',conceptGap:null,encouragement:'ลองอีกครั้ง'};}
  S.loading=false;render();
}
async function buildFlashcards(){
  S.flashcards=[];S.remMiniQuiz=[];S.cardIdx=0;S.flipped=false;S.cardsDone={};S.quizReveal={};S.loading=true;nav('flashcards');
  const ctx=S.solution?`Error:${S.solution.errorTypeThai}|กฎ:${S.solution.keyRule}|โจทย์:${S.quiz?.question}|เฉลย:${S.quiz?.answer}`:
    `หัวข้อ:${S.fileSummary?.title||''}|เนื้อหา:${S.fileSummary?.topics?.join(',')||''}`;
  try{const r=await callFlashcards(ctx);S.flashcards=r.flashcards||[];S.remMiniQuiz=r.miniQuiz||[];
    addHistory('flashcard',{topic:S.topic?.th||S.fileSummary?.title||''});}
  catch(e){console.error(e);S.flashcards=[
    {front:'กฎสำคัญที่เพิ่งผิด',back:S.solution?.keyRule||'',rule:'Key Rule',hint:'จำกฎนี้ให้ขึ้นใจ',example:'',difficulty:'medium',color:'accent'},
    {front:'เฉลยของโจทย์',back:S.quiz?.answer||'',rule:'Solution',hint:'',example:'',difficulty:'medium',color:'blue'},
  ];}
  if(S.topic)S.mastery[S.topic.id]=Math.min(100,(S.mastery[S.topic.id]||20)+(S.tbResult?.passed?18:8));
  S.loading=false;render();
}
async function loadWrongExplain(){
  const wi=S.examResult.wrong[S.wrongIdx];
  if(S.wrongExplains[wi])return;
  S.loading=true;render();
  try{S.wrongExplains[wi]=await callWrongExplain(S.examQ[wi]);}
  catch(e){S.wrongExplains[wi]={steps:[{num:1,title:'เฉลย',math:S.examQ[wi].options[S.examQ[wi].correct],explain:S.examQ[wi].explain}],keyPoint:S.examQ[wi].explain};}
  S.loading=false;render();
}
async function doFCFromExam(){
  S.flashcards=[];S.remMiniQuiz=[];S.cardIdx=0;S.flipped=false;S.cardsDone={};S.quizReveal={};S.loading=true;nav('flashcards');
  const wrongQs=S.examResult.wrong.map(i=>S.examQ[i]);
  const ctx=`เนื้อหา:${S.fileSummary?.title||''}|ข้อที่ผิด:${wrongQs.map(q=>q.q.substring(0,40)).join(';')}`;
  try{const r=await callFlashcards(ctx);S.flashcards=r.flashcards||[];S.remMiniQuiz=r.miniQuiz||[];}
  catch(e){S.flashcards=wrongQs.slice(0,4).map((q,i)=>({front:q.q.substring(0,60),back:q.options[q.correct]+'\n\n'+q.explain,rule:`ข้อ ${i+1}`,hint:'',example:'',difficulty:'medium',color:['accent','blue','purple','teal'][i]}));}
  addHistory('flashcard',{topic:S.fileSummary?.title||'',fromExam:true});
  S.loading=false;render();
}

/* ════════════════════════════════
   API SETTINGS MODAL
════════════════════════════════ */
function setupAPIModal(){
  const modal=document.getElementById('api-modal');
  const prov=document.getElementById('api-provider');
  const keyRow=document.getElementById('key-row');
  const keyInput=document.getElementById('api-key-input');
  const save=document.getElementById('api-save');
  const close=document.getElementById('api-close');
  const openBtn=document.getElementById('btn-api-open');
  if(prov){prov.value=CFG.provider||'anthropic';keyRow.style.display=CFG.provider&&CFG.provider!=='anthropic'?'block':'none';}
  if(keyInput)keyInput.value=CFG.key||'';
  if(prov)prov.addEventListener('change',()=>{keyRow.style.display=prov.value!=='anthropic'?'block':'none';});
  if(save)save.addEventListener('click',()=>{
    CFG.provider=prov.value;CFG.key=keyInput?.value?.trim()||'';
    localStorage.setItem('ff_cfg',JSON.stringify(CFG));
    modal.classList.remove('open');
    const pr={'anthropic':'Anthropic Claude','openai':'OpenAI GPT-4o','gemini':'Google Gemini'}[CFG.provider];
    alert(`✅ บันทึกแล้ว ใช้ ${pr}`);
  });
  if(close)close.addEventListener('click',()=>modal.classList.remove('open'));
  if(openBtn)openBtn.addEventListener('click',()=>modal.classList.add('open'));
  modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open');});
}

/* ════════════════════════════════
   KEYBOARD SHORTCUTS
════════════════════════════════ */
document.addEventListener('keydown',e=>{
  if(document.activeElement?.tagName==='TEXTAREA'||document.activeElement?.tagName==='INPUT')return;
  if(S.page==='exam_mc'){
    if(e.key==='ArrowLeft'&&S.examIdx>0){S.examIdx--;render();}
    if(e.key==='ArrowRight'&&S.examIdx<S.examQ.length-1&&S.examA[S.examIdx]!==undefined){S.examIdx++;render();}
  }
  if(S.page==='flashcards'){
    if(e.key==='ArrowLeft'&&S.cardIdx>0){S.cardIdx--;S.flipped=false;render();}
    if(e.key==='ArrowRight'&&S.cardIdx<S.flashcards.length-1){S.cardIdx++;S.flipped=false;render();}
    if(e.key===' '){e.preventDefault();S.flipped=!S.flipped;render();}
  }
});

/* ════════════════════════════════
   HISTORY CONTROLS
════════════════════════════════ */
document.getElementById('hist-clear')?.addEventListener('click',()=>{
  if(confirm('ลบประวัติทั้งหมด?')){HIST=[];saveHistory();renderHistory();}
});

/* ════════════════════════════════
   INIT
════════════════════════════════ */
window.addEventListener('resize',()=>renderStepBar());
setupAPIModal();
renderHistory();
render();
</script>
